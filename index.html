!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weeklish | Aprende inglés</title>
  <style>
/* Los estilos controlan colores, tamaños y ubicación de cada elemento. */
* { box-sizing: border-box; }

body {
  margin: 0;
  background-color: #eee;
  color: #111;
  font-family: Arial, sans-serif;
}

.container { max-width: 970px; margin: 16px auto; padding: 0 18px; }
h1 { margin: 0 0 18px; font-size: 28px; }
.welcome { margin: 0 0 16px; }

.header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 24px;
  margin-bottom: 20px;
}
.menu {
  display: flex;
  justify-content: flex-end;
  flex-wrap: wrap;
  gap: 15px;
  margin-top: -8px;
}
.menu button, .register-button {
  padding: 10px 20px;
  border: 0;
  border-radius: 10px;
  background: orange;
  color: #111;
  cursor: pointer;
  font-weight: bold;
}
.menu button:hover, .register-button:hover { background: darkorange; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid #1264a3; outline-offset: 2px; }

.main { display: grid; grid-template-columns: 1fr 1fr; align-items: start; gap: 40px; }
.card {
  width: 294px;
  min-height: 220px;
  padding: 20px;
  border: 2px solid #111;
  border-radius: 15px;
  background: white;
}

.card h2 { font-size: 20px; }
.games-card { width: 250px; min-height: 160px; margin: 0 auto; }
.social {
  width: 230px;
  min-height: 170px;
  margin-top: 80px;
  justify-self: end;
}
.register-dialog input {
  display: block;
  width: 100%;
  margin: 10px 0;
  padding: 10px;
  border: 1px solid #999;
  border-radius: 8px;
  font: inherit;
}

.plain-button { cursor: pointer; }
.social a { display: block; width: fit-content; margin: 8px 0; }
.social-image { display: block; object-fit: contain; }
.youtube-image { width: 180px; height: auto; }
.tiktok-image { width: 82px; height: auto; }
.message { margin: 10px 0 0; color: #14532d; font-size: 14px; }

.visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

.lesson-view { max-width: 780px; margin: 12px auto; }
.lesson-view[hidden], #home-view[hidden] { display: none; }
.back-button {
  padding: 10px 16px;
  border: 0;
  border-radius: 10px;
  background: orange;
  color: #111;
  cursor: pointer;
  font-weight: bold;
}

.back-button:hover { background: darkorange; }
.lesson-card {
  padding: 18px;
  border: 2px solid #111;
  border-radius: 15px;
  background: white;
}

.lesson-card video { display: block; width: 100%; max-height: 65vh; background: #111; border-radius: 8px; }
.bottom-back { margin-top: 16px; }
.quiz-card { margin-top: 22px; padding: 20px; border: 2px solid #111; border-radius: 15px; background: white; }
.quiz-card > h2 { margin-top: 0; }
.quiz-question { margin: 14px 0; padding: 14px; border: 1px solid #bbb; border-radius: 10px; }
.quiz-question legend { padding: 0 5px; font-weight: bold; }
.quiz-question label { display: inline-flex; align-items: center; gap: 5px; margin: 7px 12px 0 0; cursor: pointer; }
.quiz-question input { accent-color: #087c8d; }
.quiz-question.is-correct { border-color: #26834a; background: #f2fbf4; }
.quiz-question.is-incorrect { border-color: #b54343; background: #fff7f5; }
.quiz-feedback { margin: 8px 0 0; font-size: 14px; }
.quiz-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 18px; }
.quiz-result { min-height: 1.4em; margin-bottom: 0; font-weight: bold; }
.games-view { max-width: 700px; }
.game-levels { max-width: 650px; margin: 24px auto; }
.game-level-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }

.game-level-button { display: flex; min-height: 112px; flex-direction: column; justify-content: center; gap: 8px; padding: 16px; border: 2px solid #111; border-radius: 14px; background: white; cursor: pointer; text-align: left; }
.game-level-button:hover { border-color: #c77a00; background: #fff5df; }
.game-level-button strong { font-size: 22px; }
.game-level-button span { color: #444; font-size: 14px; }
.game-card { max-width: 560px; margin: 20px auto; padding: 24px; border: 2px solid #111; border-radius: 16px; background: white; text-align: center; }
.change-level-button { display: block; padding: 0; border: 0; background: transparent; color: #064f7b; cursor: pointer; font: inherit; font-weight: bold; }
.game-progress { color: #555; font-size: 14px; }
.game-word { margin: 20px 0; color: #073b61; font-size: 36px; }
.game-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.game-option { min-height: 54px; padding: 10px; border: 1px solid #888; border-radius: 10px; background: #fff; cursor: pointer; font: inherit; }
.game-option:hover:not(:disabled) { border-color: #064f7b; background: #eef9fb; }
.game-option:disabled { cursor: default; }
.game-option.game-correct { border-color: #26834a; background: #e7f6eb; }

.game-option.game-wrong { border-color: #b54343; background: #fff0ee; }
.game-feedback { min-height: 1.5em; margin: 16px 0; font-weight: bold; }
.level-selector { display: flex; flex-wrap: wrap; gap: 9px; margin: 18px 0; }
.level-selector button { min-width: 100px; padding: 9px 14px; border: 1px solid #a66b00; border-radius: 10px; background: #fff; cursor: pointer; font: inherit; font-weight: bold; }
.level-selector button[aria-pressed="true"] { border-color: #d57d00; background: orange; }
.level-selector button:hover { background: #ffd27a; }
.level-panel[hidden] { display: none; }
.text-lesson { margin-bottom: 14px; }
.text-lesson p { line-height: 1.55; }
.mini-practice { min-height: 0; }
.mini-practice h3 { margin-top: 0; }
.mini-practice li { margin: 7px 0; }
.reading-card { margin: 18px 0; padding: 22px; border: 2px solid #111; border-radius: 15px; background: white; }
.reading-card h2 { margin-top: 0; }
.reading-card > p { font-size: 17px; line-height: 1.75; }
.reading-vocab { margin: 18px 0; padding: 12px; border-radius: 10px; background: #edf8f9; line-height: 1.6; }
.reading-card details { border-top: 1px solid #ddd; padding-top: 12px; }

.reading-card summary { color: #064f7b; cursor: pointer; font-weight: bold; }
.reading-card li { margin: 7px 0; line-height: 1.5; }
.listening-practice { margin-bottom: 16px; }
.listen-line { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; padding: 12px 0; border-top: 1px solid #ddd; }
.listen-line span { font-weight: bold; }
.listen-line p { grid-column: 1 / -1; margin: 0; color: #555; }
.game-example { margin: 16px 0; padding: 14px; border-radius: 12px; background: #edf8f9; text-align: left; }
.example-label { margin: 0 0 7px; color: #07526a; font-size: 14px; font-weight: bold; }
.game-example-sentence { margin: 0 0 5px; font-size: 19px; font-weight: bold; }
.game-example-translation { margin: 0 0 12px; color: #444; }
.audio-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 14px; }
.audio-card { padding: 16px; border: 2px solid #111; border-radius: 15px; background: white; }
.audio-card h2 { margin: 0 0 12px; font-size: 18px; }
.audio-card audio { display: block; width: 100%; }
.vocab-categories { position: sticky; top: 0; z-index: 3; display: flex; flex-wrap: wrap; gap: 9px; margin: 18px 0 24px; padding: 10px 0; background: #eee; }
.vocab-category-button { padding: 9px 13px; border: 0; border-radius: 10px; background: orange; color: #111; cursor: pointer; font: inherit; font-weight: bold; }
.vocab-category-button:hover, .vocab-category-button.selected { background: darkorange; }
.vocab-category-button:focus-visible { outline: 3px solid #1264a3; outline-offset: 2px; }
.vocab-group { margin: 24px 0 32px; scroll-margin-top: 12px; }
.vocab-group h2 { margin-bottom: 12px; }
.vocabulary-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
.vocab-item { margin: 0; overflow: hidden; border: 1px solid #bbb; border-radius: 12px; background: white; }
.vocab-item a { display: grid; place-items: center; height: 220px; padding: 8px; background: white; }
.vocab-item img { display: block; width: 100%; height: 100%; object-fit: contain; }
.vocab-item figcaption { min-height: 38px; padding: 8px 10px; border-top: 1px solid #ddd; font-size: 14px; overflow-wrap: anywhere; }
.speaking-group { margin: 24px 0 30px; }
.speaking-group > h2 { margin-bottom: 12px; }
.speaking-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 290px), 1fr)); gap: 12px; }
.speaking-exercise { padding: 16px; border: 1px solid #bbb; border-radius: 12px; background: white; }

.speaking-exercise > p { margin: 0 0 10px; }
.speaking-exercise details { border-top: 1px solid #ddd; padding-top: 9px; }
.speaking-exercise summary { color: #064f7b; cursor: pointer; font-weight: bold; }
.english-phrase { margin: 12px 0 6px; font-size: 18px; font-weight: bold; }
.translation { margin: 0; color: #444; }
.speaking-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; }
.practice-button { padding: 8px 12px; border: 0; border-radius: 9px; background: orange; color: #111; cursor: pointer; font-weight: bold; }
.practice-button:hover { background: darkorange; }
.practice-button:disabled { cursor: wait; opacity: 0.7; }
.speaking-controls audio { width: 100%; margin-top: 4px; }
.recording-status { flex-basis: 100%; min-height: 1em; margin: 2px 0 0; color: #444; font-size: 14px; }
.mic-picker { margin: 18px 0 24px; padding: 16px; border: 1px solid #bbb; border-radius: 12px; background: white; }
.mic-picker > label { display: block; margin-bottom: 8px; font-weight: bold; }
.mic-picker-actions { display: flex; flex-wrap: wrap; gap: 9px; }
.mic-picker select { min-width: min(100%, 260px); max-width: 100%; padding: 8px 10px; border: 1px solid #999; border-radius: 8px; font: inherit; }
.mic-picker .recording-status { margin-bottom: 0; }

@media (max-width: 650px) {
  .container { margin-top: 22px; }
  h1 { font-size: 24px; }
  .header { flex-direction: row; align-items: flex-start; gap: 12px; }
  .main { display: flex; flex-direction: column; align-items: center; }
  .logo-image { width: 120px; height: 180px; }
  .menu { justify-content: flex-end; gap: 7px; margin-top: -5px; }
  .menu button { padding: 9px 11px; font-size: 13px; }
  .main { gap: 16px; }
  .card { width: 100%; max-width: 380px; }
  .games-card { max-width: 300px; min-height: 150px; }
  .social { min-height: 150px; margin-top: 0; }
}

@media (max-width: 460px) {
  .game-card { padding: 16px; }
  .game-options { grid-template-columns: 1fr; }
  .game-level-options { grid-template-columns: 1fr; }
  .listen-line { grid-template-columns: 1fr; }
  .listen-line p { grid-column: auto; }
}

/* En tabletas y ventanas estrechas, conserva las tarjetas una al lado de la otra. */
@media (min-width: 520px) and (max-width: 650px) {
  .main { display: flex; flex-direction: row; align-items: flex-end; gap: 12px; }
  .games-card { width: auto; min-width: 0; flex: 1 1 auto; margin: 0; }
  .social {
    width: 150px;
    min-height: 145px;
    flex: 0 0 150px;
    margin: 0 0 0 auto;
    padding: 14px;
  }
  .social h2 { font-size: 16px; }
  .youtube-image { width: 100px; }
  .tiktok-image { width: 52px; }
}

  </style>
</head>
<body>
  <main class="container">
    <div id="home-view">
      <h1>🎤 Aprende Inglés con Weeklish</h1>
      <p class="welcome">Bienvenido a nuestra página para aprender inglés fácil 😄</p>

  <header class="header">
        <img class="logo-image" src="assets/weeklish-logo.png" alt="Logo de Weeklish: aprende inglés">
        <nav class="menu" aria-label="Temas de inglés">
          <button type="button" id="grammar-button">Grammar</button>
          <button type="button" id="listening-button">Listening</button>
          <button type="button" id="reading-button">Reading</button>
          <button type="button" id="vocab-button">Vocab</button>
          <button type="button" id="speaking-button">Speaking</button>
        </nav>
      </header>

      <section class="main" aria-label="Juegos y redes sociales">
        <article class="card games-card">
          <h2>🎮 Games</h2>
          <p>Aprende inglés jugando con retos cortos de vocabulario.</p>
          <button class="register-button" id="open-games" type="button">Jugar ahora</button>
        </article>
